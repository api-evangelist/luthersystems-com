source: >-
  Named by the provider's own docs (agentsearch README + api-docs, insideout-agent-skills README/AGENTS.md,
  substrate-agent-skills SKILL.md, mars README, docs.luthersystems.com middleware pages); version and
  published date read from registry metadata on 2026-09-19 — registry.npmjs.org/@luthersystems%2F<pkg>,
  proxy.golang.org/github.com/luthersystems/<mod>/@latest, hub.docker.com/v2/repositories/luthersystems/,
  and the Homebrew formula in github.com/luthersystems/homebrew-repo. Nothing on PyPI (pypi.org/pypi/
  luthersystems, agentsearch, insideout-agent-skills, luther-insideout all 404; the PyPI project `insideout`
  belongs to a different author and is excluded), Maven Central, NuGet, RubyGems, Packagist or crates.io.
description: >-
  First-party packages fall into three products. AgentSearch and InsideOut ship MCP servers on npm (scoped
  @luthersystems, published by GitHub Actions with npm provenance) and InsideOut also as a Docker image;
  the Luther Enterprise platform ships Go SDKs (shiroclient gateway JSON-RPC client, LutherAuth JWT
  validation, the svc middleware toolkit, the ELPS interpreter), the shirotester developer CLI on npm with
  per-platform binary packages, the mars infrastructure CLI via a Homebrew tap and Docker, and Protobuf
  contracts on the Buf Schema Registry. A Java shiroclient SDK exists on GitHub but is archived (2023) and
  not on Maven Central.
