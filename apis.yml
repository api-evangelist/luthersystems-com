- aid: luthersystems-com:luther-platform-protobuf
  name: Luther Platform Protobuf Contracts
  description: >-
    Buf-managed Protocol Buffers published at github.com/luthersystems/protos (module
    buf.build/luthersystems/protos) that define API contracts and shared messages across the Luther
    Enterprise platform: the pdfserv.v1 PDFService gRPC service (rpc Generate), healthcheck.v1,
    common.v1 exceptions, a sensitive-field annotation, and 80 ConnectorHub connector configuration
    schemas (Salesforce, SAP S/4HANA, Stripe, Postgres, Kafka, DocuSign, Equifax, Anthropic Claude ...).
    The platform is customer-deployed (public cloud, private cloud or on-premise) and exposes business
    logic through the shiroclient JSON-RPC gateway and grpc-gateway-transcoded middleware, so no public
    base URL exists; the sandbox starter kit shows the pattern with a SandboxService and a generated
    Swagger 2.0. Complemented by Go SDKs, the shirotester CLI and the Substrate Agent Skill.
  humanURL: https://github.com/luthersystems/protos
  tags:
  - Protobuf
  - gRPC
  - Process Automation
  - Enterprise Automation
