- aid: luthersystems-com:insideout-mcp
  name: InsideOut (Riley) MCP Server
  description: >-
    Hosted Model Context Protocol server for InsideOut, Luther Systems' agentic cloud architect: POST
    https://app.luthersystems.com/v1/insideout-mcp, Streamable HTTP with SSE responses and an
    Mcp-Session-Id, protocol version 2025-06-18, serverInfo insideout-agent v2.0.0. initialize, tools/list
    (24 tools — convoopen/convoreply design conversation, tfgenerate/tfplan/tfdeploy/tfdestroy/tfdrift
    Terraform jobs, tfstatus/tflogs/tfoutputs/tfruns monitoring, stackversions/stackdiff/stackrollback,
    awsinspect/gcpinspect, credawait, submit_feedback, help) and prompts/list answered anonymously on
    2026-09-19. Design and pricing need no credential; deployment needs a browser-connected AWS/GCP
    account and a subscription. Also shipped as @luthersystems/insideout-mcp (npm 0.50.1) and the Docker
    image luthersystems/insideout-mcp, and packaged as Agent Skills plus Claude Code, Kiro and Cursor
    plugins; listed on Smithery, Glama and the Docker MCP Registry.
