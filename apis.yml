aid: luthersystems-com
name: Luther Systems
description: >-
  Luther Systems is a London- and Campbell, CA-based enterprise software company (Luther Systems Limited
  and Luther Systems US Incorporated) whose Luther Platform automates end-to-end enterprise processes —
  "Deep Process Automation" — for customers such as Allianz and DLA Piper's TOKO, running business logic
  (ELPS "phyla") on the Substrate runtime over Hyperledger Fabric with ConnectorHub integrations, a
  shiroclient JSON-RPC gateway, LutherAuth identity and Buf-managed Protobuf contracts. Its public,
  agent-native surface is two products: AgentSearch (agentsearch.luthersystems.com) — a free, no-auth,
  daily-scored index of ~4,300 AI agents and MCP servers exposed as an OpenAPI 3.1 HTTP API, a hosted
  Streamable HTTP MCP server (5 tools) plus an npm stdio package, and an A2A 0.3.0 agent card with a live
  JSON-RPC endpoint — and InsideOut (Riley) — an agentic cloud architect that designs, prices, generates
  Terraform for, deploys and inspects AWS/GCP infrastructure through a hosted MCP server at
  app.luthersystems.com (24 tools, session-scoped, no keys for design), an A2A 0.3 card, provider-published
  Agent Skills, Claude Code / Kiro / Cursor plugins and a Docker image. The enterprise platform ships Go
  SDKs, the shirotester CLI (with a local MCP server), the mars infrastructure CLI and a public docs
  repository with dated release notes.
