description: >-
  Three products, three pricing postures, and only one of them is machine-readable. AgentSearch is free
  with no tiers (card pricing.model "free"; api-docs "Everything is public, no auth"). InsideOut has
  "unit/tier-based pricing" with "no usage limits" per its llms.txt and a subscription is required before
  deployment (credawait), but https://insideout.luthersystems.com/pricing is a client-rendered SPA whose
  served HTML is a 2,637-byte shell, so no tier names or prices could be read. The enterprise Luther
  Platform publishes a consumption ESTIMATOR (cores = orgs x peers x cores-per-peer, process-run bands
  1,000–5,000,000) and an AWS hosting-cost method (~GBP 96/month fixed baseline plus variable) but no
  price list; commercial terms are by sales call.
