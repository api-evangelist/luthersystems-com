source: >-
  openapi/luthersystems-com-agentsearch-openapi.yml, https://agentsearch.luthersystems.com/api-docs and
  /llms.txt, the AgentSearch agent card (pricing.rateLimit), the live InsideOut tools/list descriptions
  (mcp/luthersystems-com-insideout-mcp-tools.json — tfplan, tfdeploy, tfdestroy, stackrollback,
  stackversions, tflogs) and the InsideOut SKILL.md / SECURITY.md.
description: >-
  Two surfaces with different semantics. AgentSearch is a read-only, anonymous HTTP/MCP/A2A API — no
  writes to protect, page/page_size pagination, undocumented error envelope beyond one 404, best-effort
  per-IP rate limiting with no documented headers. InsideOut is a session-scoped MCP surface whose writes
  are Terraform jobs: it has a first-class dry run (tfplan -> plan_id -> tfdeploy), a single-flight rule
  per session, versioned stack designs with rollback, and a destroy operation — but it documents no
  idempotency key and no time window for any reversal.
