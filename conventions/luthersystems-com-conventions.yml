  insideout: '/v1/insideout-mcp path; A2A v0 (0.3) and root (1.0) endpoints coexist'
error_envelope:
  http: 'undocumented beyond 404 on getAgent (no schema)'
  jsonrpc: 'JSON-RPC 2.0 error {code, message, data[google.rpc.ErrorInfo]} on the InsideOut A2A endpoint; MCP errors as JSON-RPC errors or tool-level codes (tf_job_conflict, auth_required)'
rate_limit_signaling:
  documented: '~60 requests per minute per IP, best effort (agent card pricing.rateLimit); api-docs: "no rate limit beyond best-effort fairness"'
  headers: not documented
  status_on_exhaustion: not documented
idempotency:
  coverage: none
  header: null
  retention: null
  scope: []
  note: >-
    AgentSearch exposes no mutating operation in its OpenAPI or tool list (POST /api/search and
    /api/found-agent compute and return; the only write, POST /api/submit-agent, is documented outside the
    spec with no idempotency mechanism). InsideOut's mutating tools (convoopen, tfgenerate, tfdeploy,
    tfdestroy, stackrollback, submit_feedback) document no idempotency key; the closest mechanism is the
    single-flight rule — a second tfdeploy/tfplan/tfdestroy while a job is in flight returns
    tf_job_conflict with the live job_id instead of starting a duplicate, and force_new=true overrides it.
    That is duplicate suppression for one job at a time, not replay protection, so coverage is none.
dry_run:
  status: documented
  mechanism: 'tfplan runs terraform plan without applying; returns job_id, plan_id, project_id; tfdeploy accepts plan_id to apply exactly that plan'
  scope: [tfdeploy]
  evidence: live tfplan and tfdeploy tool descriptions
reversibility:
  status: documented
  note: >-
    Reversal paths exist for the two InsideOut write surfaces but NO time window is stated anywhere, so
    the grade is documented (reversal path) rather than verified (path + window). AgentSearch is read-only
    (na). Enterprise-platform reversals (Terraform state, phylum migrations) are customer-operated and
    not on a public surface.
  surfaces:
  - write: tfdeploy (deploy infrastructure to the user's AWS/GCP account)
    reversal: tfdestroy
    reversal_operation: tfdestroy
    window: not stated
    conditions: 'session must have a prior successful deployment; single-flight rule applies; long-running job monitored via tfstatus/tflogs'
    docs: https://github.com/luthersystems/insideout-agent-skills/blob/main/SKILL.md
  - write: convoreply / tfgenerate (advance or change the stack design)
    reversal: stackrollback
    reversal_operation: stackrollback
    window: not stated
    conditions: 'creates a draft version copying a previous version''s components/config/pricing (single-draft rule); use stackversions to list targets'
    docs: live tool description (mcp/luthersystems-com-insideout-mcp-tools.json)
  - write: tfplan
    reversal: na
    note: A plan applies nothing; nothing to reverse.
  - write: submit_feedback / POST /api/submit-agent
    reversal: none documented
  - write: AgentSearch reads
    reversal: na
    note: Read-only API.
